<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;color:#fff4ff;background:radial-gradient(ellipse at 50% 45%,#44245c 0%,#261331 48%,#110c19 100%);font-family:Georgia,serif}
[hidden]{display:none!important}
main{width:min(100%,760px);text-align:center}
h1{font-size:clamp(2rem,7vw,4.6rem);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.035em}
.cover{position:relative;padding:48px 0 34px;isolation:isolate}
.heart-button{display:inline-grid;justify-items:center;gap:12px;border:0;background:none;color:#f2d7fa;font:inherit;cursor:pointer;padding:12px 8px 16px;border-radius:25px}
.heart-button:focus-visible,.back:focus-visible{outline:2px solid #f7cafb;outline-offset:5px}
.heart-glow{display:grid;place-items:center;width: min(62vw,275px);aspect-ratio:1;filter:drop-shadow(0 16px 25px #0f0619aa) drop-shadow(0 0 33px #be59f080);transition:transform .25s}
.heart-button:hover .heart-glow{transform:scale(1.055)}
.heart-button:active .heart-glow{transform:scale(.96)}
.heart{width:73%;aspect-ratio:1;transform:translateY(5%) rotate(-45deg);position:relative;filter:brightness(1.12);background:linear-gradient(135deg,#4a126e 6%,#903bc3 58%,#b95de8);border-radius:10% 0 19% 7%;box-shadow:inset 0 -9px 18px #35104a82}
.heart::before,.heart::after{content:"";position:absolute}
.heart::before{width:100%;height:64%;top:-38%;left:0;border-radius:100% 100% 0 0;background:radial-gradient(ellipse at 32% 33%,#efb8ff 0%,#b865e9 31%,#913dc1 69%);mask-image:linear-gradient(#000 72%,transparent)}
.heart::after{width:64%;height:100%;left:74%;top:0;border-radius:0 100% 100% 0;background:radial-gradient(ellipse at 28% 20%,#e69aff,#b95de8 55%,#6d238d);mask-image:linear-gradient(90deg,transparent,#000 34%)}
.flower{width:clamp(83px,21vw,166px);aspect-ratio:1;position:absolute;z-index:-1;border-radius:50%;background:radial-gradient(ellipse,#9955a4 35%,transparent 70%);filter:drop-shadow(0 12px 15px #12091ecc);opacity:.84}
.flower i{position:absolute;width:35%;aspect-ratio:1;left:var(--x);top:var(--y);transform:translate(-50%,-50%) rotate(var(--r));background:radial-gradient(ellipse at center,#f5d8e8 0 7%,transparent 10%),radial-gradient(ellipse at 50% 25%,hsl(var(--h) 76% 81%) 0 22%,transparent 26%),radial-gradient(ellipse at 25% 50%,hsl(var(--h) 69% 71%) 0 22%,transparent 26%),radial-gradient(ellipse at 75% 50%,hsl(var(--h) 58% 63%) 0 22%,transparent 26%),radial-gradient(ellipse at 50% 75%,hsl(var(--h) 52% 58%) 0 22%,transparent 26%)}
.flower.left{left:0;bottom:5%;transform:rotate(-18deg)}
.flower.right{right:0;top:28%;transform:rotate(20deg)}
.message{background:#26172ef2;border:1px solid #bd8bc75c;padding:clamp(12px,3vw,26px);border-radius:24px;box-shadow:0 22px 72px #0d071a9c}
.message img{display:block;width:100%;height:auto;border-radius:15px}
.message p{max-width:33ch;margin:22px auto;font-size:clamp(1.13rem,3.8vw,1.55rem);line-height:1.56}
.back{color:#f2d7fa;background:transparent;border:1px solid #af7ec58c;border-radius:999px;padding:10px 19px;font:inherit;cursor:pointer}
@media(prefers-reduced-motion:reduce){.heart-glow{transition:none}}
</style>

<script>
const cover = document.getElementById('cover');
const message = document.getElementById('message');
const openCard = document.getElementById('open-card');
const closeCard = document.getElementById('close-card');

function showMessage (isOpen) {
  cover.hidden = isOpen;
  message.hidden = !isOpen;
  if (isOpen) {
    message.focus();
  } else {
    openCard.focus();
  }
}

openCard.addEventListener('click', () => showMessage(true));
closeCard.addEventListener('click', () => showMessage(false));
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && !message.hidden) showMessage(false);
});
</script>
