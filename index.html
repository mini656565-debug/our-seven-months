:root{color-scheme:light;--ink:#50274d;--script:'Card Script','Segoe Script','Snell Roundhand','Apple Chancery','Gabriola',Georgia,cursive}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#e1bcde radial-gradient(ellipse at 50% 18%,#fff0f8,#d7adcf 65%,#ae84b8);color:var(--ink);font-family:Georgia,serif}
[hidden]{display:none!important}
main{width:100%;min-height:100svh;display:grid;place-items:center}
.cover{width:min(100%,810px);aspect-ratio:1;position:relative;isolation:isolate;text-align:center;margin:0 auto}
.cover-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.cover:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(#fff1fa9e,transparent 32%,transparent 73%,#562d5665);pointer-events:none}
h1{position:absolute;top:13%;width:100%;margin:0;padding:0 .2em;font:italic 400 clamp(2rem,8vw,4.7rem)/1.1 var(--script);text-shadow:0 1px 10px #ffe9f5;text-wrap:balance}
.open{position:absolute;inset:28% 20% 27%;width:60%;padding:0;border:0;border-radius:44%;background:transparent;cursor:pointer}
.open:focus-visible,.back:focus-visible{outline:3px solid #71365f;outline-offset:4px}
.open span{position:absolute;top:100%;left:50%;transform:translateX(-50%);width:max-content;max-width:88vw;border:1px solid #fff8;padding:.48em .9em;border-radius:999px;color:#50274d;background:#fff0faeb;font:italic 400 clamp(1.12rem,4.5vw,1.65rem)/1.2 var(--script);transition:background .2s,box-shadow .2s}
.open:hover span,.open:focus-visible span{background:#fff6ff;box-shadow:0 0 24px #fff}
.letter{width:min(calc(100% - 40px),690px);margin:28px auto;text-align:center}
.paper{position:relative;padding:clamp(23px,5vw,43px) clamp(15px,4.7vw,40px);background:linear-gradient(90deg,#eac9dc,#ffeff3 10%,#fff8f5 50%,#ffeff3 90%,#eac9dc);box-shadow:0 18px 40px #582e5352;animation:unroll 850ms cubic-bezier(.2,.75,.25,1) both;transform-origin:top center}
.paper::before,.roll{height:16px;background:linear-gradient(#f9e8ef,#f7dfeb 28%,#dbabcb 73%,#c78db5);box-shadow:0 4px 7px #814e7066;border-radius:999px}
.paper::before{content:"";position:absolute;z-index:1;inset:-6px -7px auto}
.roll{position:absolute;z-index:1;inset:auto -7px -6px;animation:roll-down 850ms cubic-bezier(.2,.75,.25,1) both}
@keyframes unroll{from{clip-path:inset(-12px -12px calc(100% - 18px))}to{clip-path:inset(-12px -12px -14px)}}
@keyframes roll-down{from{top:8px;bottom:auto}to{top:100%;bottom:auto;translate:0 -10px}}
.photo{display:block;width:100%;height:auto;border:5px solid #fffaf6;border-radius:5px;box-shadow:0 3px 14px #6d405342}
.words{margin:clamp(15px,3.5vw,25px) auto 0;font:italic 400 clamp(1.3rem,5vw,2.2rem)/1.28 var(--script)}
.words p{margin:.42em 0;text-wrap:pretty}
.words p:first-child{font-size:1.13em}
.back{margin-top:22px;padding:.5em .95em;border:1px solid #bb85a7;border-radius:999px;background:#fff0f9;color:var(--ink);font:italic 400 1.18rem/1.2 var(--script);cursor:pointer}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>
const cover = document.getElementById('cover');
const letter = document.getElementById('letter');
const openCard = document.getElementById('open-card');
const closeCard = document.getElementById('close-card');

function showLetter(isOpen) {
  cover.hidden = isOpen;
  letter.hidden = !isOpen;
  (isOpen ? letter : openCard).focus({preventScroll:true});
  window.scrollTo(0, 0);
}

openCard.addEventListener('click', () => showLetter(true));
closeCard.addEventListener('click', () => showLetter(false));
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && !letter.hidden) showLetter(false);
});
</script>
